[defaults]
# 默认主机清单文件
inventory = inventory.yml

# 不检查主机密钥（首次连接免确认）
host_key_checking = False

# 并发数
forks = 5

# 输出格式
stdout_callback = yaml

# 超时设置
timeout = 30

# 重试文件不生成
retry_files_enabled = False

# 颜色输出
force_color = True

[privilege_escalation]
# 默认使用 sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False
