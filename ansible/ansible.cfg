[defaults]
# 默认主机清单文件
inventory = inventory.yml

# 不检查主机密钥（首次连接免确认）
host_key_checking = False

# 并发数
forks = 5

# 输出格式（如需 yaml 格式需安装 pyyaml）
# stdout_callback = yaml

# 超时设置
timeout = 30

# 重试文件不生成
retry_files_enabled = False

# 颜色输出
force_color = True

# 强制模块使用 UTF-8 locale，避免中文/特殊字符导致反序列化失败
module_set_locale = True
module_lang = C.UTF-8
module_env_vars = LANG=C.UTF-8,LC_ALL=C.UTF-8

# 禁用模块响应的严格 UTF-8 检查（Ansible 2.15+）
module_strict_utf8_response = False

[privilege_escalation]
# 默认使用 sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False
