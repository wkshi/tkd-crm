---
# app_deploy role：同步代码、渲染环境变量文件

- name: 创建部署目录
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: tkd-crm
    group: tkd-crm
    mode: "0755"

- name: 同步项目代码到目标服务器
  ansible.posix.synchronize:
    src: "{{ playbook_dir | dirname }}/"
    dest: "{{ deploy_dir }}/"
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=.next"
      - "--exclude=coverage"
      - "--exclude=__tests__"
      - "--exclude=tests"
      - "--exclude=.env.local"
      - "--exclude=ansible"
      - "--exclude=.kimi"
      - "--exclude=scripts"
      - "--exclude=.DS_Store"
      - "--delete"
  delegate_to: localhost
  become: false

- name: 设置部署目录权限
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: tkd-crm
    group: tkd-crm
    recurse: true

- name: 创建 uploads 目录
  ansible.builtin.file:
    path: "{{ deploy_dir }}/public/uploads"
    state: directory
    owner: tkd-crm
    group: tkd-crm
    mode: "0755"

- name: 渲染 .env 配置文件
  ansible.builtin.template:
    src: env-native.j2
    dest: "{{ deploy_dir }}/.env"
    owner: tkd-crm
    group: tkd-crm
    mode: "0600"

- name: 安装 npm 依赖
  ansible.builtin.command: npm ci --registry=https://registry.npmjs.org/
  args:
    chdir: "{{ deploy_dir }}"
  become: true
  become_user: tkd-crm
  environment:
    HOME: "{{ deploy_dir }}"
    NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
  changed_when: true

- name: 生成 Prisma Client
  ansible.builtin.command: npx prisma generate
  args:
    chdir: "{{ deploy_dir }}"
  become: true
  become_user: tkd-crm
  environment:
    HOME: "{{ deploy_dir }}"
  changed_when: true

- name: 执行数据库迁移
  ansible.builtin.command: npx prisma migrate deploy
  args:
    chdir: "{{ deploy_dir }}"
  become: true
  become_user: tkd-crm
  environment:
    HOME: "{{ deploy_dir }}"
    NODE_ENV: production
    NEXT_OUTPUT: "standalone"
  changed_when: true

- name: 构建生产版本
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ deploy_dir }}"
  become: true
  become_user: tkd-crm
  environment:
    HOME: "{{ deploy_dir }}"
    NODE_ENV: production
    NEXT_OUTPUT: "standalone"
  changed_when: true

- name: 复制 public 资源到 standalone 目录
  ansible.builtin.copy:
    src: "{{ deploy_dir }}/public/"
    dest: "{{ deploy_dir }}/.next/standalone/public/"
    remote_src: true
    owner: tkd-crm
    group: tkd-crm
    mode: preserve

- name: 复制静态资源到 standalone 目录
  ansible.builtin.copy:
    src: "{{ deploy_dir }}/.next/static/"
    dest: "{{ deploy_dir }}/.next/standalone/.next/static/"
    remote_src: true
    owner: tkd-crm
    group: tkd-crm
    mode: preserve
