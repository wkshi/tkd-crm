---
# nodejs_setup role：安装 Node.js 22 和 PostgreSQL（软件包方案）

- name: 跳过 Node.js 安装（Docker 方案）
  ansible.builtin.debug:
    msg: "使用 Docker 方案，跳过 Node.js 和 PostgreSQL 本地安装"
  when: use_docker

- name: 安装 Node.js 和 PostgreSQL（软件包方案）
  when: not use_docker
  block:
    # ─── Debian/Ubuntu ───
    - name: 安装 Node.js 和 PostgreSQL（Debian/Ubuntu）
      when: ansible_os_family == "Debian"
      block:
        - name: 安装前置依赖
          ansible.builtin.apt:
            name:
              - curl
              - ca-certificates
              - gnupg
            state: present
            update_cache: true

        - name: 添加 NodeSource GPG 密钥
          ansible.builtin.apt_key:
            url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
            state: present

        - name: 添加 NodeSource APT 仓库
          ansible.builtin.apt_repository:
            repo: "deb https://deb.nodesource.com/node_22.x nodistro main"
            state: present
            filename: nodesource
            update_cache: true

        - name: 安装 Node.js
          ansible.builtin.apt:
            name: nodejs
            state: present

        - name: 安装 PostgreSQL
          ansible.builtin.apt:
            name:
              - postgresql
              - postgresql-contrib
            state: present

        - name: 启动并启用 PostgreSQL
          ansible.builtin.systemd:
            name: postgresql
            state: started
            enabled: true

    # ─── CentOS/RHEL ───
    - name: 安装 Node.js 和 PostgreSQL（CentOS/RHEL）
      when: ansible_os_family == "RedHat"
      block:
        - name: 添加 NodeSource YUM 仓库
          ansible.builtin.yum_repository:
            name: nodesource-nodejs
            description: NodeSource Node.js 22
            baseurl: >
              https://rpm.nodesource.com/pub_22.x/nodistro/nodejs/
              {{ 'x86_64' if ansible_architecture == 'x86_64' else 'aarch64' }}
            gpgcheck: true
            gpgkey: https://rpm.nodesource.com/gpgkey/nodesource.gpg.key
            enabled: true

        - name: 安装 Node.js
          ansible.builtin.dnf:
            name: nodejs
            state: present

        - name: 添加 PostgreSQL YUM 仓库
          ansible.builtin.yum_repository:
            name: postgresql16
            description: PostgreSQL 16
            baseurl: >
              https://download.postgresql.org/pub/repos/yum/16/redhat/
              rhel-{{ ansible_distribution_major_version }}-{{
              'x86_64' if ansible_architecture == 'x86_64' else 'aarch64' }}
            gpgcheck: true
            gpgkey: https://download.postgresql.org/pub/repos/yum/RPM-GPG-KEY-PGDG
            enabled: true

        - name: 安装 PostgreSQL
          ansible.builtin.dnf:
            name:
              - postgresql16-server
              - postgresql16-contrib
            state: present

        - name: 初始化 PostgreSQL 数据库
          ansible.builtin.command: /usr/pgsql-16/bin/postgresql-16-setup initdb
          args:
            creates: /var/lib/pgsql/16/data/PG_VERSION
          changed_when: false

        - name: 启动并启用 PostgreSQL
          ansible.builtin.systemd:
            name: postgresql-16
            state: started
            enabled: true

    # ─── 通用配置 ───
    - name: 创建应用运行用户
      ansible.builtin.user:
        name: tkd-crm
        system: true
        home: "{{ deploy_dir }}"
        shell: /bin/bash
        create_home: false

    - name: 创建应用运行组
      ansible.builtin.group:
        name: tkd-crm
        system: true
        state: present

    - name: 确保运行用户存在
      ansible.builtin.user:
        name: tkd-crm
        group: tkd-crm
        system: true
        state: present

    - name: 验证 Node.js 安装
      ansible.builtin.command: node --version
      register: node_version
      changed_when: false

    - name: 验证 npm 安装
      ansible.builtin.command: npm --version
      register: npm_version
      changed_when: false

    - name: 输出 Node.js 版本
      ansible.builtin.debug:
        msg:
          - "Node.js: {{ node_version.stdout }}"
          - "npm: {{ npm_version.stdout }}"
