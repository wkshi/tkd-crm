---
# precheck role：收集目标系统信息，确认 RPM 包管理环境

- name: 收集目标系统信息
  ansible.builtin.setup:
    filter:
      - ansible_architecture
      - ansible_kernel
      - ansible_system
      - ansible_distribution
      - ansible_distribution_major_version
      - ansible_os_family

- name: 确认目标系统为 RedHat 系（RPM 包管理）
  ansible.builtin.fail:
    msg: "本部署方案仅支持 RedHat 系操作系统（CentOS/RHEL/Rocky/AlmaLinux/Fedora），当前系统为 {{ ansible_facts['distribution'] }}"
  when: ansible_facts['os_family'] != "RedHat"

- name: 输出系统信息与部署方式
  ansible.builtin.debug:
    msg:
      - "目标主机: {{ inventory_hostname }}"
      - "系统: {{ ansible_facts['system'] }} {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
      - "架构: {{ ansible_facts['architecture'] }}"
      - "内核: {{ ansible_facts['kernel'] }}"
      - "部署方式: RPM 包安装 + systemd 服务"
