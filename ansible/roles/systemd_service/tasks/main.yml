---
# systemd_service role：创建并管理 systemd 服务

- name: 创建 systemd 服务文件
  ansible.builtin.template:
    src: tkd-crm-native.service.j2
    dest: /etc/systemd/system/tkd-crm.service
    owner: root
    group: root
    mode: "0644"

- name: 确保 systemd 已重载
  ansible.builtin.systemd:
    daemon_reload: true

- name: 停止旧服务（如果正在运行）
  ansible.builtin.systemd:
    name: tkd-crm
    state: stopped
  failed_when: false

- name: 启动并启用 tkd-crm 服务
  ansible.builtin.systemd:
    name: tkd-crm
    state: started
    enabled: true
    daemon_reload: true

- name: 等待应用启动
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/api/config"
    method: GET
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: "{{ health_check_retries }}"
  delay: "{{ health_check_delay }}"

- name: 输出部署结果
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "  {{ app_name }} 部署成功！"
      - "========================================"
      - "部署路径: {{ deploy_dir }}"
      - "访问地址: http://{{ ansible_host | default(inventory_hostname) }}:{{ app_port }}"
      - ""
      - "systemd 管理命令:"
      - "  systemctl start tkd-crm      启动服务"
      - "  systemctl stop tkd-crm       停止服务"
      - "  systemctl restart tkd-crm    重启服务"
      - "  systemctl status tkd-crm     查看状态"
      - "  journalctl -u tkd-crm -f     查看日志"
