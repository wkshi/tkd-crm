---
# docker_setup role：安装 Docker Engine 和 Docker Compose Plugin

- name: 跳过 Docker 安装（条件不满足）
  ansible.builtin.debug:
    msg: "当前主机不满足 Docker 安装条件，跳过 Docker 安装步骤"
  when: not use_docker

- name: 跳过 Docker 安装（已安装）
  ansible.builtin.debug:
    msg: "Docker 和 Docker Compose 已安装，跳过安装步骤"
  when:
    - use_docker
    - docker_already_installed

# ─── Debian/Ubuntu 安装 Docker ───
- name: 安装 Docker（Debian/Ubuntu）
  when:
    - use_docker
    - not docker_already_installed
    - ansible_os_family == "Debian"
  block:
    - name: 安装 Docker 前置依赖
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: 添加 Docker 官方 GPG 密钥
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        state: present

    - name: 添加 Docker APT 仓库
      ansible.builtin.apt_repository:
        repo: >
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_lsb.codename | default(ansible_distribution_release) }} stable
        state: present
        filename: docker
        update_cache: true

    - name: 安装 Docker Engine 和 Compose 插件
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

# ─── CentOS/RHEL 安装 Docker ───
- name: 安装 Docker（CentOS/RHEL/Rocky/AlmaLinux）
  when:
    - use_docker
    - not docker_already_installed
    - ansible_os_family == "RedHat"
  block:
    - name: 安装 yum-utils
      ansible.builtin.dnf:
        name: yum-utils
        state: present

    - name: 添加 Docker YUM 仓库
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable
        baseurl: >
          https://download.docker.com/linux/centos/
          {{ ansible_distribution_major_version }}/
          {{ 'x86_64' if ansible_architecture == 'x86_64' else 'aarch64' }}/stable
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg
        enabled: true

    - name: 安装 Docker Engine 和 Compose 插件
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

# ─── 配置并启动 Docker 服务 ───
- name: 启动并启用 Docker 服务
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
  when: use_docker

- name: 将当前用户加入 docker 组
  ansible.builtin.user:
    name: "{{ ansible_user | default(ansible_ssh_user) }}"
    groups: docker
    append: true
  when:
    - use_docker
    - ansible_user | default(ansible_ssh_user) != 'root'

- name: 验证 Docker 安装
  ansible.builtin.command: docker --version
  register: docker_version_result
  changed_when: false
  when: use_docker

- name: 验证 Docker Compose 安装
  ansible.builtin.command: docker compose version
  register: compose_version_result
  changed_when: false
  when: use_docker

- name: 输出 Docker 版本
  ansible.builtin.debug:
    msg:
      - "{{ docker_version_result.stdout | default('N/A') }}"
      - "{{ compose_version_result.stdout | default('N/A') }}"
  when:
    - use_docker
    - docker_version_result is defined
