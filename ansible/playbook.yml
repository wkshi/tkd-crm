---
# 跆拳道馆 CRM 部署 Playbook
# 在 RedHat 系服务器上通过 RPM 包安装 Node.js + PostgreSQL，并封装为 systemd 服务
# 用法: ansible-playbook ansible/playbook.yml

- name: "部署 跆拳道馆 CRM"
  hosts: tkd_crm_servers
  gather_facts: true

  roles:
    - role: precheck
      tags: [precheck, setup]

    - role: system_setup
      tags: [system, setup]

    - role: app_deploy
      tags: [deploy, app]

    - role: systemd_service
      tags: [systemd, service]
