name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      DATABASE_URL: postgresql://taekwondo:taekwondo123@localhost:5432/taekwondo_crm

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taekwondo
          POSTGRES_PASSWORD: taekwondo123
          POSTGRES_DB: taekwondo_crm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile=./test-results/junit.xml

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Vitest Tests
          path: ./test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Type check
        run: npm run typecheck

      - name: Lint check
        run: npm run lint

      - name: Build check
        run: npm run build

  # ─── Ansible 部署脚本测试 ───
  ansible-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: |
          pip install ansible ansible-lint

      - name: Run ansible-lint
        run: ansible-lint ansible/

      - name: Prepare Ansible inventory for syntax check
        run: cp ansible/inventory.yml.example ansible/inventory.yml

      - name: Run ansible-playbook syntax check
        run: |
          cd ansible && ansible-playbook -i inventory.yml playbook.yml --syntax-check
          ansible-playbook -i inventory.yml deploy-only.yml --syntax-check

